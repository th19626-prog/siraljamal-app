name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk SirAljamal-Agencies.apk
      - uses: actions/upload-artifact@v4
        with: { name: SirAljamal-apk, path: SirAljamal-Agencies.apk }
      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" SirAljamal-Agencies.apk --title "سر الجمال - الوكالات $TAG" --notes "نسخة تلقائية من آخر تحديث." --latest
